
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Account A provider infrastructure for cross-account AWS PrivateLink
  connectivity to MariaDB, including database initialization and
  secure application credentials.

Parameters:
  ConsumerAccountId:
    Type: String
    Default: '846904544394'
    AllowedPattern: '^\d{12}$'
    Description: AWS account ID of the consumer.

  ConsumerVpcCidr:
    Type: String
    Default: 172.31.0.0/16
    Description: Consumer VPC CIDR.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
    Description: EC2 instance type for MariaDB.

  DatabaseName:
    Type: String
    Default: privatelink_demo
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]*$'
    Description: Application database name.

  DatabaseUsername:
    Type: String
    Default: privatelink_app
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]{0,31}$'
    Description: Dedicated application database user.

Resources:
  ProviderVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: mysqlprovidervpc

  ProviderSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProviderVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: mysqlprovidersubnet-a

  ProviderSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProviderVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: mysqlprovidersubnet-b

  ProviderRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ProviderVpc
      Tags:
        - Key: Name
          Value: mysql-provider-rt

  ProviderSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProviderSubnetA
      RouteTableId: !Ref ProviderRouteTable

  ProviderSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProviderSubnetB
      RouteTableId: !Ref ProviderRouteTable

  ProviderInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: mysql-provider-ec2-role

  ProviderInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ProviderInstanceRole

  ProviderDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Credentials for the PrivateLink MariaDB application user
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DatabaseUsername}"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true
        IncludeSpace: false
      Tags:
        - Key: Name
          Value: privatelink-demo-db-credentials

  ProviderDatabaseSecretAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ReadProviderDatabaseCredentials
      Roles:
        - !Ref ProviderInstanceRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref ProviderDatabaseSecret

  ProviderSsmEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS access to private AWS service endpoints
      VpcId: !Ref ProviderVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: mysql-provider-service-endpoints-sg

  ProviderSsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ProviderVpc
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm'
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref ProviderSubnetA
        - !Ref ProviderSubnetB
      SecurityGroupIds:
        - !Ref ProviderSsmEndpointSecurityGroup

  ProviderSsmMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ProviderVpc
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssmmessages'
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref ProviderSubnetA
        - !Ref ProviderSubnetB
      SecurityGroupIds:
        - !Ref ProviderSsmEndpointSecurityGroup

  ProviderSecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ProviderVpc
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref ProviderSubnetA
        - !Ref ProviderSubnetB
      SecurityGroupIds:
        - !Ref ProviderSsmEndpointSecurityGroup

  ProviderS3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ProviderVpc
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds:
        - !Ref ProviderRouteTable

  ProviderNlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow TCP 3306 from consumer VPC CIDR
      VpcId: !Ref ProviderVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: !Ref ConsumerVpcCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: mysql-nlb-sg

  ProviderEc2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MariaDB traffic from NLB security group
      VpcId: !Ref ProviderVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref ProviderNlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: mysqlprovider-sg

  ProviderDatabaseInstanceV2:
    Type: AWS::EC2::Instance
    DependsOn:
      - ProviderS3Endpoint
      - ProviderSsmEndpoint
      - ProviderSsmMessagesEndpoint
      - ProviderSecretsManagerEndpoint
      - ProviderDatabaseSecretAccessPolicy
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref ProviderInstanceProfile
      SubnetId: !Ref ProviderSubnetA
      SecurityGroupIds:
        - !Ref ProviderEc2SecurityGroup
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/mariadb-setup.log | logger -t user-data -s 2>/dev/console) 2>&1

          echo "Installing MariaDB..."
          dnf makecache
          dnf install -y mariadb105-server

          systemctl enable --now mariadb

          echo "Waiting for MariaDB to become ready..."
          for attempt in $(seq 1 30); do
            if mariadb-admin ping --silent; then
              break
            fi
            sleep 2
          done

          mariadb-admin ping --silent

          echo "Retrieving database credentials from Secrets Manager..."
          SECRET_JSON=""
          for attempt in $(seq 1 30); do
            if SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id '${ProviderDatabaseSecret}' --query SecretString --output text --region '${AWS::Region}' 2>/dev/null); then
              break
            fi
            sleep 5
          done

          if [ -z "$SECRET_JSON" ]; then
            echo "ERROR: Could not retrieve database credentials."
            exit 1
          fi

          DB_PASSWORD=$(printf '%s' "$SECRET_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["password"])')

          echo "Creating application database and restricted user..."
          mariadb <<SQL
          CREATE DATABASE IF NOT EXISTS ${DatabaseName};

          CREATE USER IF NOT EXISTS '${DatabaseUsername}'@'%'
            IDENTIFIED BY '$DB_PASSWORD';

          ALTER USER '${DatabaseUsername}'@'%'
            IDENTIFIED BY '$DB_PASSWORD';

          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, INDEX, ALTER
            ON ${DatabaseName}.* TO '${DatabaseUsername}'@'%';

          USE ${DatabaseName};

          CREATE TABLE IF NOT EXISTS connection_test (
            id INT AUTO_INCREMENT PRIMARY KEY,
            message VARCHAR(255) NOT NULL,
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );

          INSERT INTO connection_test (message)
          SELECT 'PrivateLink database initialized'
          WHERE NOT EXISTS (
            SELECT 1 FROM connection_test
            WHERE message = 'PrivateLink database initialized'
          );
          SQL

          unset DB_PASSWORD SECRET_JSON
          echo "MariaDB database initialization completed."
      Tags:
        - Key: Name
          Value: mysqlproviderec2

  ProviderTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: mysql-tcp-tg
      VpcId: !Ref ProviderVpc
      Protocol: TCP
      Port: 3306
      TargetType: instance
      Targets:
        - Id: !Ref ProviderDatabaseInstanceV2
          Port: 3306
      HealthCheckEnabled: true
      HealthCheckProtocol: TCP
      HealthCheckPort: traffic-port
      Tags:
        - Key: Name
          Value: mysql-tcp-tg

  ProviderNetworkLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: mysql-tcp-nlb
      Type: network
      Scheme: internal
      IpAddressType: ipv4
      Subnets:
        - !Ref ProviderSubnetA
        - !Ref ProviderSubnetB
      SecurityGroups:
        - !Ref ProviderNlbSecurityGroup
      EnforceSecurityGroupInboundRulesOnPrivateLinkTraffic: 'on'
      LoadBalancerAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: 'true'
      Tags:
        - Key: Name
          Value: mysql-tcp-nlb

  ProviderNlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ProviderNetworkLoadBalancer
      Protocol: TCP
      Port: 3306
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ProviderTargetGroup

  ProviderEndpointService:
    Type: AWS::EC2::VPCEndpointService
    DependsOn: ProviderNlbListener
    Properties:
      AcceptanceRequired: true
      NetworkLoadBalancerArns:
        - !Ref ProviderNetworkLoadBalancer

  ProviderEndpointServicePermissions:
    Type: AWS::EC2::VPCEndpointServicePermissions
    Properties:
      ServiceId: !Ref ProviderEndpointService
      AllowedPrincipals:
        - !Sub 'arn:${AWS::Partition}:iam::${ConsumerAccountId}:root'

Outputs:
  ProviderVpcId:
    Description: Provider VPC ID
    Value: !Ref ProviderVpc

  ProviderSubnetAId:
    Description: Provider subnet A ID
    Value: !Ref ProviderSubnetA

  ProviderSubnetBId:
    Description: Provider subnet B ID
    Value: !Ref ProviderSubnetB

  ProviderInstanceId:
    Description: New MariaDB EC2 instance ID
    Value: !Ref ProviderDatabaseInstanceV2

  ProviderNlbArn:
    Description: Internal NLB ARN
    Value: !Ref ProviderNetworkLoadBalancer

  ProviderNlbDnsName:
    Description: Internal NLB DNS name
    Value: !GetAtt ProviderNetworkLoadBalancer.DNSName

  ProviderTargetGroupArn:
    Description: Database target group ARN
    Value: !Ref ProviderTargetGroup

  ProviderEndpointServiceId:
    Description: PrivateLink endpoint service ID
    Value: !Ref ProviderEndpointService

  ProviderEndpointServiceName:
    Description: Service name for Account B
    Value: !Sub 'com.amazonaws.vpce.${AWS::Region}.${ProviderEndpointService}'

  ProviderDatabaseName:
    Description: Initialized application database
    Value: !Ref DatabaseName

  ProviderDatabaseUsername:
    Description: Application database username
    Value: !Ref DatabaseUsername

  ProviderDatabaseSecretArn:
    Description: Secrets Manager ARN containing the generated credentials
    Value: !Ref ProviderDatabaseSecret
